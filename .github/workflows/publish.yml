# Publica o pacote no npm (registry oficial npmjs.org) ao criar uma tag `v*`.
#
# Fluxo:
#   git tag v1.0.1 && git push origin v1.0.1   -> dispara este workflow
#
# Pre-requisito (uma unica vez):
#   - Criar um Automation token no npmjs.com (Access Tokens -> Generate New Token
#     -> Automation) e adiciona-lo nos secrets do repo como NPM_TOKEN
#     (Settings -> Secrets and variables -> Actions -> New repository secret).
#   - A org/usuario @flexicorp deve existir no npmjs.com e sua conta ter
#     permissao de publish nela.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (registry npm oficial)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verificar que a versao do package.json casa com a tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION | tag: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::A versao do package.json ($PKG_VERSION) nao corresponde a tag ($TAG_VERSION)."
            exit 1
          fi

      - name: Publish (publico)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
