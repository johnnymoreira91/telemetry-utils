# Prometheus — recebe metricas via remote_write (Alloy e Tempo generator).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Auto-scrape do proprio Prometheus.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metricas internas do Alloy (opcional, util para debug do pipeline).
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
